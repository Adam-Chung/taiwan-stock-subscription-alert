name: Daily stock subscription alert

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Do not send LINE or persist a sent record
        required: true
        type: boolean
        default: true
      evaluation_date:
        description: Optional evaluation date in YYYY-MM-DD; blank uses today in Taipei
        required: false
        type: string
      force_resend:
        description: Send again even if this date already has a success record
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-stock-subscription-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_TARGET_ID_001: ${{ secrets.LINE_TARGET_ID_001 }}
      LINE_TARGET_ID_002: ${{ secrets.LINE_TARGET_ID_002 }}
      LINE_TARGET_ID_003: ${{ secrets.LINE_TARGET_ID_003 }}
      LINE_TARGET_ID_004: ${{ secrets.LINE_TARGET_ID_004 }}
      LINE_TARGET_ID_005: ${{ secrets.LINE_TARGET_ID_005 }}
      MIN_DISCOUNT_PERCENT: "20"
      MIN_SAFETY_MARGIN_PERCENT: "10"
      HTTP_MIN_INTERVAL_MS: "1500"
      ENABLE_MOPS_FETCH: ${{ vars.ENABLE_MOPS_FETCH || 'true' }}
      EVALUATION_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.evaluation_date || '' }}
      FORCE_RESEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_resend || 'false' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run check

      - name: Evaluate and notify
        run: npm start

      - name: Persist successful delivery marker
        if: ${{ env.DRY_RUN == 'false' }}
        run: |
          if git diff --quiet -- data/run-history.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/run-history.json
          git commit -m "chore: record daily alert delivery"
          git pull --rebase
          git push
